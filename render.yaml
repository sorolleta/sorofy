# Blueprint de Render: API (.NET en Docker) + PostgreSQL, ambos en plan gratis.
# En Render: New > Blueprint > elige este repo. Te pedirá las claves de Spotify.
services:
  - type: web
    name: sorofy-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sorofy-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: samespot-api
      - key: JWT_AUDIENCE
        value: samespot-web
      - key: FRONTEND_URL
        value: https://sorolleta.github.io/sorofy
      - key: SPOTIFY_REDIRECT_URI
        value: https://sorofy-api.onrender.com/api/auth/spotify/callback
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

databases:
  - name: sorofy-db
    plan: free
    region: frankfurt
    databaseName: samespot
    user: samespot
